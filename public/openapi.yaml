openapi: 3.1.0
info:
  title: Nectar Engine API
  version: 1.0.0
  description: High-risk affiliate workflow API for offer-to-content generation and platform-aware compliance scanning.
servers:
  - url: https://nectar-engine.vercel.app
paths:
  /api/generate:
    post:
      operationId: generateNectarToolkit
      summary: Turn an affiliate offer into campaign content
      description: Generate three campaign angles, nine platform-specific posts, headlines, body copy, CTAs, and source-grounded compliance notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generated toolkit
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GeneratedToolkit'
        '400':
          description: Invalid offer input
        '429':
          description: Provider rate limit
        '503':
          description: Generator unavailable
  /api/scan:
    post:
      operationId: scanNectarContent
      summary: Scan content for platform-specific risk signals
      description: Return Pass, Warning, or Fail for each selected platform, with exact flagged phrases and a safer rewrite when needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: Scan results
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformResult'
        '400':
          description: Invalid scan input
        '503':
          description: Scanner unavailable
components:
  schemas:
    GenerateRequest:
      type: object
      required: [offerText]
      properties:
        offerText:
          type: string
          minLength: 20
        offerUrl:
          type: string
          format: uri
    ScanRequest:
      type: object
      required: [content, platforms]
      properties:
        content:
          type: string
          minLength: 10
        platforms:
          type: array
          minItems: 1
          items:
            type: string
            enum: [TikTok, Instagram, Facebook, Reddit, X, Pinterest, Snapchat, Discord, Telegram]
    PromoAngle:
      type: object
      required: [angle, hook, body]
      properties:
        angle: {type: string}
        hook: {type: string}
        body: {type: string}
    SocialPost:
      type: object
      required: [platform, character_count, text]
      properties:
        platform: {type: string}
        character_count: {type: integer}
        text: {type: string}
    Headline:
      type: object
      required: [variant, text]
      properties:
        variant: {type: string}
        text: {type: string}
    CTA:
      type: object
      required: [id, text, tone]
      properties:
        id: {type: string}
        text: {type: string}
        tone: {type: string}
    ComplianceNote:
      type: object
      required: [platform, note]
      properties:
        platform: {type: string}
        note: {type: string}
    GeneratedToolkit:
      type: object
      required: [promo_angles, social_posts, headlines, body_copy, cta_variations, compliance_notes]
      properties:
        promo_angles:
          type: array
          items: {$ref: '#/components/schemas/PromoAngle'}
        social_posts:
          type: array
          items: {$ref: '#/components/schemas/SocialPost'}
        headlines:
          type: array
          items: {$ref: '#/components/schemas/Headline'}
        body_copy: {type: string}
        cta_variations:
          type: array
          items: {$ref: '#/components/schemas/CTA'}
        compliance_notes:
          type: array
          items: {$ref: '#/components/schemas/ComplianceNote'}
    PlatformResult:
      type: object
      required: [platform, status, flagged_phrases, reason, safer_rewrite]
      properties:
        platform: {type: string}
        status:
          type: string
          enum: [pass, warn, fail]
        flagged_phrases:
          type: array
          items: {type: string}
        reason: {type: string}
        safer_rewrite: {type: string}
